# Anonymizer benchmark configuration.
#
# Runs one de-identification method over a pipeline-generated gold dataset and
# scores it via the canonical text-replacement evaluation path (the anonymizer
# emits full PHI-replaced text; it is aligned back to offsets and matched against
# the gold spans). Paths are resolved relative to this file's directory.
#
# Run with:
#   python -m experiments.benchmark --config experiments/benchmark/example_config.yaml

schema_version: 1

# Gold-standard dataset (pipeline output JSONL: doc_id / text / spans per line).
dataset_path: ../../datasets/default/dataset.jsonl

# Predictions and the JSON report land in <output_dir>/<anonymizer.name>/.
output_dir: ../results/benchmark

# Uncomment for a quick smoke test on the first few documents.
# limit: 10

anonymizer:
  name: gemini
  model: gemini-3.7-flash
  # SQLite response cache — makes reruns free and resumable after interruption.
  cache_db: ../results/benchmark/gemini_anon_cache.db
  temperature: 0.1
  retry_attempts: 3
  retry_delay_seconds: 5
  # Concurrent LLM calls; tune to your Vertex AI requests-per-minute quota.
  workers: 4

evaluation:
  # strict | lenient (IoU) | token
  matching: lenient
  iou_threshold: 0.5
  verbose: false
